<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="title desc">
<title id="title">Ezra Desmond Sutanto — AI and Full-Stack Developer</title>
<desc id="desc">Ezra Desmond Sutanto. AI and Full-Stack Developer.</desc>
<style>.glow{animation:drift 12s ease-in-out infinite alternate}.shine{animation:shine 7s ease-in-out infinite alternate}@keyframes drift{to{transform:translate(70px,-15px);opacity:.6}}@keyframes shine{to{opacity:.45}}@media(prefers-reduced-motion:reduce){.glow,.shine{animation:none}}</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B1623"/><stop offset="1" stop-color="#102B35"/></linearGradient><linearGradient id="name"><stop stop-color="#D7F5E9"/><stop offset=".5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#BDEB9B"/></linearGradient><linearGradient id="line"><stop stop-color="#79D9C5" stop-opacity="0"/><stop offset=".5" stop-color="#C7F464"/><stop offset="1" stop-color="#79D9C5" stop-opacity="0"/></linearGradient><radialGradient id="halo"><stop stop-color="#329D8A" stop-opacity=".45"/><stop offset="1" stop-color="#329D8A" stop-opacity="0"/></radialGradient><clipPath id="frame"><rect width="1000" height="230" rx="14"/></clipPath></defs>
