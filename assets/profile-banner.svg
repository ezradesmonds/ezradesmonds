<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="Ezra Desmond Sutanto - AI and Full-Stack Product Builder">
  <title>Ezra Desmond Sutanto — AI &amp; Full-Stack Product Builder</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1026"/>
      <stop offset="55%" stop-color="#171442"/>
      <stop offset="100%" stop-color="#0A1430"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="0.55" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#9FC4FF"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CBA6FF"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="0 0; 1 0; 0 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4776E6"/>
      <stop offset="100%" stop-color="#8E54E9"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8E54E9"/>
      <stop offset="100%" stop-color="#4776E6"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4776E6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8E54E9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4776E6" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <clipPath id="frame"><rect width="1000" height="230" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="230" fill="url(#sky)"/>

    <!-- drifting aurora -->
    <g filter="url(#soft)" opacity="0.55">
      <circle cx="230" cy="70" r="95" fill="#4776E6">
        <animate attributeName="cx" values="230;350;230" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="70;120;70" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="760" cy="150" r="105" fill="#8E54E9">
        <animate attributeName="cx" values="760;650;760" dur="16s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="150;80;150" dur="13s" repeatCount="indefinite"/>
      </circle>
      <circle cx="500" cy="40" r="70" fill="#22D3EE" opacity="0.5">
        <animate attributeName="cy" values="40;110;40" dur="18s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- starfield -->
    <g fill="#FFFFFF">
      <circle cx="90" cy="45" r="1.6"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="38" r="1.3"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.3s" repeatCount="indefinite"/></circle>
      <circle cx="620" cy="28" r="1.1"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="185" r="1.4"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="945" cy="120" r="1.2"><animate attributeName="opacity" values="0.25;0.8;0.25" dur="5.2s" repeatCount="indefinite"/></circle>
      <circle cx="160" cy="150" r="1.1"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="4.7s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="60" r="1"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- name -->
    <text x="500" y="103" text-anchor="middle" fill="url(#nameGrad)"
      font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="46" font-weight="700" letter-spacing="1.5">
      Ezra Desmond Sutanto
      <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
    </text>

    <!-- animated rule -->
    <rect x="330" y="120" width="340" height="2" fill="url(#rule)" rx="1">
      <animate attributeName="width" values="0;340" dur="1.1s" begin="0.5s" fill="freeze"/>
      <animate attributeName="x" values="500;330" dur="1.1s" begin="0.5s" fill="freeze"/>
      <animate attributeName="opacity" values="0.45;1;0.45" dur="3.5s" begin="1.6s" repeatCount="indefinite"/>
    </rect>

    <!-- subtitle -->
    <text x="500" y="150" text-anchor="middle" fill="#B9C6E4" opacity="0"
      font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace"
      font-size="15.5" letter-spacing="2.6">
      AI &amp; Full-Stack Product Builder
      <animate attributeName="opacity" values="0;1" dur="1s" begin="1s" fill="freeze"/>
    </text>

    <!-- scrolling waves -->
    <g opacity="0.75">
      <path fill="url(#wave1)" opacity="0.45"
        d="M0,183 C125,158 250,208 500,183 C750,158 875,208 1000,183 C1125,158 1250,208 1500,183 C1750,158 1875,208 2000,183 L2000,230 L0,230 Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="12s" repeatCount="indefinite"/>
      </path>
      <path fill="url(#wave2)" opacity="0.9"
        d="M0,199 C140,222 260,178 500,199 C740,220 860,178 1000,199 C1140,222 1260,178 1500,199 C1740,220 1860,178 2000,199 L2000,230 L0,230 Z">
        <animateTransform attributeName="transform" type="translate" from="-1000 0" to="0 0" dur="18s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
