<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">Ezra Desmond Sutanto — AI and Full-Stack Developer</title>
<desc id="desc">From workflow to working product. Data flows through intelligence into useful software.</desc>
<style>.flow{stroke-dasharray:6 12;animation:flow 2s linear infinite}@keyframes flow{to{stroke-dashoffset:-36}}.pulse{animation:pulse 4s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B1623"/><stop offset="1" stop-color="#103A40"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#91DCD0" stroke-opacity=".06"/></pattern></defs>
<rect width="1000" height="300" rx="16" fill="url(#bg)"/><rect width="1000" height="300" rx="16" fill="url(#grid)"/>
<path d="M0 0H1000" stroke="#C7F464" stroke-width="5"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="49" fill="#79D9C5" font-family="Consolas,monospace" font-size="13" letter-spacing="3">FROM WORKFLOW TO WORKING PRODUCT</text>
<text x="46" y="111" fill="#F1F6F5" font-size="47" font-weight="700" letter-spacing="-1">Ezra Desmond Sutanto</text>
<text x="48" y="147" fill="#B3D0CF" font-size="21">AI &amp; Full-Stack Developer</text>
<text x="48" y="177" fill="#86A9AE" font-size="16">Turning manual workflows into useful software.</text>
<g transform="translate(48 211)">
<path d="M190 25H335M555 25H700" stroke="#35696B" stroke-width="2"/>
<path class="flow" d="M190 25H335M555 25H700" stroke="#C7F464" stroke-width="2"/>
<rect width="190" height="50" rx="8" fill="#112D36" stroke="#37636C"/><rect x="335" width="220" height="50" rx="8" fill="#14433F" stroke="#5CADA0"/><rect x="700" width="204" height="50" rx="8" fill="#C7F464"/>
<text x="95" y="32" text-anchor="middle" fill="#DEECEB" font-size="17" font-weight="600">Data</text><text x="445" y="32" text-anchor="middle" fill="#D3F2E8" font-size="17" font-weight="600">Intelligence</text><text x="802" y="32" text-anchor="middle" fill="#18251A" font-size="17" font-weight="700">Useful software</text>
</g></g><circle class="pulse" cx="938" cy="46" r="5" fill="#C7F464"/></svg>